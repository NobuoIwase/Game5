<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>モーション一覧 | Game5</title>
<style>
:root{font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#edf1ec;background:#0b1114;--muted:#9cafb7;--line:#304149;--accent:#c8e9ad}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none;outline-offset:5px}.page{max-width:1060px;margin:0 auto;padding:45px 34px 28px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:22px}.eyebrow{font-size:10px;color:var(--accent);letter-spacing:.17em;margin:0 0 12px}h1{font-size:clamp(27px,4.5vw,40px);line-height:1.4;letter-spacing:.035em;font-weight:600;margin:0}.subtitle{font-size:13px;line-height:1.9;color:var(--muted);margin:12px 0 0}.edition{font-size:10px;white-space:nowrap;color:#c4d1d5;border:1px solid var(--line);border-radius:30px;padding:8px 12px;margin-top:3px}.edition::before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin-right:8px}.section-label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:32px 0 12px;font-size:11px;color:#a8bec7}.section-label strong{font-size:12px;font-weight:500;letter-spacing:.07em;color:#dae4e6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{display:block;background:#152026;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s,background .15s}.card:hover{border-color:#83a58d;background:#1b2b32}.art{height:235px;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at 50% 62%,#2b424c 0,transparent 67%);position:relative}.art::after{content:"";position:absolute;left:26%;bottom:8%;width:48%;height:10%;border:1px solid #526b7840;border-radius:50%;pointer-events:none}.art img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1;padding:9px 14px 0}.tag{position:absolute;top:12px;left:12px;border:1px solid #476052;border-radius:6px;background:#1b2d2590;padding:5px 8px;color:#cee6b9;font-size:10px;z-index:2}.info{border-top:1px solid #293e48;padding:15px 15px 14px}.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{margin:0;font-size:15px;font-weight:600;letter-spacing:.03em}.arrow{font-size:20px;color:#bfd9a5;line-height:1}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:10px;color:#92aab6}.footnote{font-size:11px;line-height:1.85;color:var(--muted);margin:19px 1px 0}.footer{border-top:1px solid #263a44;padding-top:18px;margin-top:29px;font-size:10px;color:#758d98;line-height:1.8;display:flex;justify-content:space-between;gap:18px}.status{font-size:13px;color:var(--muted)}.status:empty{display:none}
@media(max-width:700px){.page{padding:28px 15px 24px}.header{gap:12px}.edition{font-size:9px;padding:7px 9px}.eyebrow{font-size:9px;letter-spacing:.14em}.subtitle{font-size:11px}.section-label{margin-top:27px;font-size:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.art{height:clamp(180px,47vw,235px)}.art img{padding:8px 8px 0}.tag{top:9px;left:9px;font-size:9px;padding:4px 6px}.info{padding:12px 11px}.name{font-size:13px}.meta{font-size:9px;gap:4px;flex-wrap:wrap;line-height:1.5}.arrow{font-size:18px}.footer{display:block}.footer span{display:block;margin-bottom:6px}.footnote{font-size:10px}}@media(max-width:390px){.edition{display:none}.section-label span{font-size:9px}.name{font-size:12px}.title-row{gap:8px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main class="page">
  <header class="header"><div><p class="eyebrow">GAME5 / CHARACTER MOTION LIBRARY</p><h1>モーション一覧</h1><p class="subtitle">キャラクターと動作を選んで、8方向の動きを確認。<br>ひとつずつ開ける、軽量プレビューです。</p></div><span class="edition" id="edition">試作</span></header>
  <div class="section-label"><strong>歩行・走行プレビュー</strong><span>各8方向 × 8コマ</span></div>
  <p class="status" id="status" role="status">一覧を読み込み中…</p>
  <section class="grid" id="catalog" aria-label="キャラクター別の確認ページ"></section>
  <p class="footnote">各カードの容量は、開くページの目安です。ページ内で再生速度や背景を切り替えられます。</p>
  <footer class="footer"><span>CHARACTER MOTION ARCHIVE / 001</span><span>HTMLを1つだけ取り出すと、別ページへのリンクが開けない場合があります。</span></footer>
</main>
<script type="application/json" id="catalog-data">__CATALOG_JSON__</script>
<script>
"use strict";
const catalog=JSON.parse(document.getElementById("catalog-data").textContent);
document.getElementById("edition").textContent="試作 v"+catalog.revision;
const grid=document.getElementById("catalog");
function sizeLabel(bytes){const n=Number(bytes);return Number.isFinite(n)&&n>0?"約 "+Math.ceil(n/1024).toLocaleString("ja-JP")+" KB":""}
for(const page of catalog.pages){const card=document.createElement("a");card.className="card";card.href=page.href;const label=(page.label||page.id)+"・"+(page.motion_label||page.motion_id);card.setAttribute("aria-label",label+"の8方向プレビューを開く");const art=document.createElement("div");art.className="art";const tag=document.createElement("span");tag.className="tag";tag.textContent=page.motion_label||page.motion_id;const image=document.createElement("img");image.alt="";image.src=page.thumbnail;image.decoding="async";image.width=192;image.height=256;art.append(image,tag);const info=document.createElement("div");info.className="info";const titleRow=document.createElement("div");titleRow.className="title-row";const title=document.createElement("h2");title.className="name";title.textContent=label;const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="↗";arrow.setAttribute("aria-hidden","true");titleRow.append(title,arrow);const meta=document.createElement("div");meta.className="meta";const views=document.createElement("span");views.textContent="8方向 / 8コマ";const size=document.createElement("span");size.textContent=sizeLabel(page.bytes);meta.append(views,size);info.append(titleRow,meta);card.append(art,info);grid.append(card)}
document.getElementById("status").textContent=catalog.pages.length?"":"表示できるモーションがありません。";
</script>
</body>
</html>
