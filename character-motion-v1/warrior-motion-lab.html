<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warrior Motion Lab v0.6.0</title>
<style>
body{margin:0;background:#101720;color:#eef;font:14px system-ui}main{max-width:980px;margin:auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{padding:8px;background:#18232c;color:#eef;border:1px solid #40505c;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.card{background:#18232c;padding:12px;border-radius:12px}
.stage{display:grid;place-items:center;min-height:300px;background:#111820}.stage canvas{max-width:100%;height:auto}
.qa{margin-top:12px;padding:10px;background:#171925;border-left:3px solid #b99ae8}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>戦士モーション検査室 <small>v0.6.0</small></h1>
<p>walk/run は完成スプライト、攻撃・拘束・エステラは本編と同じ関節レンダラーです。</p>
<div class="bar">
<select id="m"><option value="walk">歩行</option><option value="run">走行</option><option value="slash">通常斬り</option><option value="heavy">破城斬り</option><option value="bind">拘束</option><option value="estella">エステラ</option></select>
<select id="d"><option>front</option><option>down_right</option><option selected>right</option><option>up_right</option><option>back</option><option>up_left</option><option>left</option><option>down_left</option></select>
<select id="s"><option value=".5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
<button id="play" type="button">停止</button><button id="prev" type="button">◀ 1コマ</button><button id="next" type="button">1コマ ▶</button>
</div>
<div class="grid">
<section class="card"><b>戦士</b><div class="stage"><canvas id="w" width="384" height="543"></canvas></div><p id="wm"></p></section>
<section class="card"><b>汎用素体</b><div class="stage"><canvas id="g" width="192" height="256"></canvas></div><p id="gm"></p></section>
</div>
<div class="qa" id="qa">QA読込中…</div>
</main>
<script src="../game/warrior-motion.js"></script><script src="./warrior-motion-lab.js"></script>
</body></html>
