<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新作の素材</title><link rel="icon" href="data:,"><style>
:root{--bg:#1d2029;--card:#272b36;--tx:#e6e2ea;--sub:#a6a2b0;--line:#3a3f4c}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 "Noto Sans JP",sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
p{color:var(--sub);margin:0 0 8px}.row{display:flex;flex-wrap:wrap;gap:10px}
.c{background:var(--card);border-radius:8px;padding:8px;text-align:center;width:132px}
.c img{width:116px;height:116px;object-fit:contain}
.stage{width:116px;height:132px;overflow:hidden;position:relative;margin:0 auto}
.stage img{position:absolute;left:50%;bottom:0;height:120px;width:auto;object-fit:initial;transform:translateX(-50%)}.c b{display:block;font-size:13px}.c small{color:var(--sub)}
.t{display:inline-block;border-radius:4px;padding:0 6px;font-size:12px;margin-left:4px}
.惑{background:#5b3d8c}.蕩{background:#8c3d63}.絡{background:#3d6b8c}.削{background:#2f7a7a}
.room-card{max-width:100%;width:294px;background:var(--card);padding:8px;border-radius:8px}.room-card canvas{width:100%;height:auto;image-rendering:pixelated}.room-card label{display:inline-block;margin-right:8px}.room-card b{display:block}
</style></head><body>
<h1>新作の素材</h1><p>ひかり（素の姿・変身後、4方向。歩きのコマは使わず、1枚の絵を滑らせて動かす）と、魔物・罠の絵。</p>
<h2>ひかり</h2><div class="row" id="hk"></div>
<h2>魔物</h2><div id="mon"></div>
<h2>罠</h2><div id="trap"></div>
<h2>部屋のスキン</h2><p>7×5マス。入室前・入室後、fill=0／0.5／1 を切り替えて比較できます。</p><div class="row" id="rooms"></div>
<script src="../js/data.js"></script>
<script src="../js/render.js"></script>
<script>
const roomViews=[];
for(const key of Object.keys(G.ROOM_SKINS)){
 const card=document.createElement('div');card.className='room-card';
 card.innerHTML=`<b>${key}</b><canvas width="288" height="224" aria-label="${key}の部屋"></canvas><label><input type="checkbox">入室後</label><label>fill <select><option>0</option><option>0.5</option><option>1</option></select></label>`;
 document.getElementById('rooms').append(card);
 roomViews.push({key,card,ctx:card.querySelector('canvas').getContext('2d')});
}
let lastRooms=0;
function roomFrame(t){
 if(t-lastRooms>50){lastRooms=t;for(const v of roomViews){const r=v.card.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;G.Render.roomPreview(v.ctx,v.key,v.card.querySelector('input').checked,+v.card.querySelector('select').value,matchMedia('(prefers-reduced-motion: reduce)').matches?0:t/1000,'../');}}
 requestAnimationFrame(roomFrame);
}
requestAnimationFrame(roomFrame);
const DIRS=['front','left','right','back'],JP={front:'前',left:'左',right:'右',back:'後ろ'};
// 歩きのコマ送りはしない（崩れるため）。各向きの真ん中の1枚を、向いている方へ滑らせるだけ。
const MOVE={front:[0,1],back:[0,-1],left:[-1,0],right:[1,0]};
for(const [n,label] of [['hikari_civilian','素の姿'],['hikari_magica','変身後']])for(const d of DIRS){
 const c=document.createElement('div');c.className='c';
 c.innerHTML=`<div class="stage"><img src="hikari/${n}_${d}_1.png" alt=""></div><b>${label}</b><small>${JP[d]}</small>`;
 document.getElementById('hk').append(c);
 const im=c.querySelector('img'),[mx,my]=MOVE[d];let t=0;
 setInterval(()=>{t+=0.05;const k=Math.sin(t)*14;im.style.transform=`translate(calc(-50% + ${mx*k}px), ${my*k*0.5}px)`},40);
}
fetch('monsters/roster.json').then(r=>r.json()).then(({monsters})=>{const box=document.getElementById('mon');
 for(const t of ['惑','蕩','絡','削']){const h=document.createElement('h2');h.innerHTML=`<span class="t ${t}">${t}</span>`;box.append(h);const row=document.createElement('div');row.className='row';box.append(row);
  for(const m of monsters.filter(m=>m.type===t))row.insertAdjacentHTML('beforeend',`<div class="c"><img src="monsters/${m.file||m.id+'.'+(m.art==='game4'?'png':'svg')}" alt=""${m.tint?` style="filter:hue-rotate(${m.tint}deg) saturate(1.2)"`:''}><b>${m.name}</b><small>${m.from}・${{game4:'Game4の絵',new:'新規',game5:'Game5の絵'}[m.art]}</small></div>`)}});
const tb=document.getElementById('trap');
for(const t of ['惑','蕩','絡','削']){const h=document.createElement('h2');h.innerHTML=`<span class="t ${t}">${t}</span>`;tb.append(h);const row=document.createElement('div');row.className='row';tb.append(row);
 for(const [k,d] of Object.entries(G.TRAPS).filter(([k,d])=>d.type===t))row.insertAdjacentHTML('beforeend',`<div class="c"><img src="traps/${k}.${k==='web'||k==='tower'?'png':'svg'}" alt=""><b>${d.name}</b><small>${k==='web'||k==='tower'?'Game4の絵':'新規'}</small></div>`)}
</script></body></html>
