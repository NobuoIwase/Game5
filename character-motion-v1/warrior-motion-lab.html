<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warrior Motion Lab v0.7.0</title><style>
body{margin:0;background:#101720;color:#eef;font:14px system-ui}main{max-width:980px;margin:auto;padding:16px}.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{padding:8px;background:#18232c;color:#eef;border:1px solid #40505c;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.card{background:#18232c;padding:12px;border-radius:12px}.stage{display:grid;place-items:center;min-height:300px;background:#111820}.stage canvas{max-width:100%;height:auto}.qa{margin-top:12px;padding:10px;background:#171925;border-left:3px solid #b99ae8}.tag{display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;border-radius:8px;background:#263343}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main>
<h1>戦士モーション検査室 <small>v0.7.0</small></h1>
<p>歩行・走行は完成スプライト。戦闘・状態モーションは本編と同じ状態レンダラーを再生します。</p>
<div class="bar">
<select id="m">
<option value="walk">歩行</option><option value="run">走行</option>
<option value="idle">待機</option><option value="turn">振り向き</option><option value="dodge">回避</option>
<option value="slash">通常斬り</option><option value="heavy">破城斬り</option><option value="bash">盾撃</option><option value="guard">防御</option>
<option value="hit">被弾</option><option value="stun">気絶</option><option value="bind">拘束</option><option value="estella">エステラ</option>
<option value="recovery">復帰</option><option value="defeat">敗北</option>
</select>
<select id="d"><option>front</option><option>down_right</option><option selected>right</option><option>up_right</option><option>back</option><option>up_left</option><option>left</option><option>down_left</option></select>
<select id="s"><option value=".5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
<button id="play" type="button">停止</button><button id="prev" type="button">◀ 1コマ</button><button id="next" type="button">1コマ ▶</button>
</div>
<div class="grid"><section class="card"><b>戦士</b><div class="stage"><canvas id="w" width="384" height="543"></canvas></div><p id="wm"></p></section>
<section class="card"><b>汎用素体（walk/run比較）</b><div class="stage"><canvas id="g" width="192" height="256"></canvas></div><p id="gm"></p></section></div>
<div class="qa" id="qa">モーション読み込み中…</div>
</main>
<script src="../game/warrior-motion.js"></script><script src="../game/warrior-motion-runtime.js"></script><script src="../game/warrior-motion-extra.js"></script><script src="./warrior-motion-lab.js"></script>
</body></html>
