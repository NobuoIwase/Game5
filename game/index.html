<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game5 v0.3.0</title><link rel="stylesheet" href="./battle.css"></head><body><div class="app">
<div class="top"><div><small>GAME5 v0.3.0</small><h1>灰冠の試練</h1></div><div class="enemy"><div class="row"><b>灰冠の呪術騎士</b><span id="enemyHpText"></span></div><div class="bar"><i id="enemyHp"></i></div><div class="row muted"><span id="enemyState"></span><span id="enemyCast"></span></div></div></div>
<div class="arena"><canvas id="cv" width="960" height="540"></canvas><div class="overlay" id="startOverlay"><div class="card"><h2>ヒロインは操作しない。</h2><p>アリアは視界・聴覚・記憶・学習から自分で移動と技を選びます。プレイヤーは敵側として罠を配置し、AUTOにも任せられます。</p><button class="primary" id="startBtn">戦闘開始</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><b id="endKicker"></b><h2 id="endTitle"></h2><p id="endText"></p><button class="primary" id="restartBtn">再戦</button></div></div></div>
<div class="dashboard"><div class="panel"><div class="row"><b id="heroName"></b><span id="heroStatus"></span></div><div class="resource"><b>HP</b><div class="meter"><i id="hpFill"></i></div><span id="hpText"></span></div><div class="resource"><b>MP</b><div class="meter"><i id="mpFill"></i></div><span id="mpText"></span></div><div class="resource"><b>SP</b><div class="meter"><i id="spFill"></i></div><span id="spText"></span></div><small id="stats"></small><div class="thought"><small>THOUGHT</small><div id="thought"></div></div><p id="perception"></p><p id="knowledge"></p></div><div class="panel"><b>習得技 / AI自動選択</b><div class="skills" id="skills"></div></div></div>
<div class="director"><div class="directorTop"><div><b>敵側ディレクター</b><small>戦場クリックで配置 / 1・2・3切替</small></div><button id="autoBtn"></button></div><div class="resource"><b>EN</b><div class="meter"><i id="directorEn"></i></div><span id="directorEnText"></span></div><div class="tools"><button data-tool="snare">1 影杭</button><button data-tool="fog">2 瘴気壺</button><button data-tool="lure">3 囮鐘</button></div></div>
</div><script src="./battle-core.js"></script><script src="./battle-player.js"></script><script src="./battle-enemy.js"></script><script src="./battle-render.js"></script><script src="./battle-ui.js"></script></body></html>
