<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>8方向モーション</title>
<style>
:root{font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#edf1ec;background:#0b1114;--muted:#9cafb7;--line:#304149;--accent:#c8e9ad;--card:#152026}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,select{color:inherit}button,a,select,input{outline-offset:4px}a{color:inherit;text-decoration:none}button{cursor:pointer}button:disabled{opacity:.4;cursor:wait}.page{max-width:1240px;margin:0 auto;padding:28px 34px 24px}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.back{font-size:12px;color:#bfd4d9;padding:8px 0}.back:hover{text-decoration:underline}.edition{color:var(--accent);font-size:10px;letter-spacing:.09em}.eyebrow{font-size:10px;color:var(--accent);letter-spacing:.17em;margin:0 0 9px}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}h1{font-size:clamp(26px,4vw,38px);line-height:1.35;font-weight:600;letter-spacing:.035em;margin:0}.subtitle{font-size:12px;color:var(--muted);line-height:1.8;margin:9px 0 0}.frame-label{font:12px ui-monospace,Consolas,monospace;color:#b7cbd2;white-space:nowrap}.navigation{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:23px 0 20px}.link-group{display:flex;gap:4px;padding:4px;background:#1a282f;border:1px solid var(--line);border-radius:10px}.link-group a{padding:9px 15px;font-size:12px;border-radius:6px;white-space:nowrap}.link-group a:hover{background:#30424b}.link-group a[aria-current="page"]{background:var(--accent);color:#19251c;font-weight:700}.navigation-note{font-size:10px;color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 13px 0;font-size:11px;color:#dce7e9}.code{font:10px ui-monospace,Consolas,monospace;letter-spacing:.08em;color:#7f9aa7}.stage{height:clamp(190px,24vw,280px);background:radial-gradient(ellipse at 50% 61%,#2a404a 0,transparent 68%);position:relative}.stage::after{content:"";position:absolute;left:24%;bottom:7%;width:52%;height:11%;border:1px solid #526b7840;border-radius:50%;pointer-events:none}.stage canvas{display:block;width:100%;height:100%;position:relative;z-index:1}.grid.light .stage{background-color:#e3e8e3;background-image:linear-gradient(45deg,#d6dfd7 25%,transparent 25%),linear-gradient(-45deg,#d6dfd7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d6dfd7 75%),linear-gradient(-45deg,transparent 75%,#d6dfd7 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.controls{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:15px;margin-top:15px;background:#121d23;border:1px solid var(--line);border-radius:12px}.transport{display:flex;gap:6px}.button{min-width:40px;min-height:42px;padding:9px 12px;background:#23343d;border:1px solid #3a505c;border-radius:8px;font-size:12px}.play{min-width:97px;background:var(--accent);border-color:var(--accent);color:#152017;font-weight:700}.seek{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}.seek input{accent-color:var(--accent);width:100%;min-width:70px}.seek span{font:10px ui-monospace,Consolas,monospace;color:#93adb9}.speed-label{font-size:10px;color:var(--muted)}.speed{background:#23343d;border:1px solid #3a505c;border-radius:8px;padding:11px 10px;min-height:42px;font-size:12px}.background{margin-left:auto;white-space:nowrap}.status{font-size:12px;color:var(--muted);line-height:1.8;margin:10px 0;min-height:0}.status:empty{display:none}.status.error{color:#ffc0b3;background:#43282a;padding:12px;border-radius:8px}.tip{font-size:11px;color:var(--muted);line-height:1.8;margin:14px 2px 0}.footer{border-top:1px solid #263a44;margin-top:25px;padding-top:17px;display:flex;justify-content:space-between;gap:15px;font-size:10px;color:#758d98;line-height:1.7}.footer a{color:#b5c9d1}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:700px){.page{padding:19px 14px 23px}.topline{margin-bottom:19px}.edition{font-size:9px}.heading{align-items:flex-start;gap:12px}.frame-label{font-size:10px;padding-top:12px}.subtitle{font-size:11px}.navigation{gap:10px;margin:20px 0 15px}.link-group a{font-size:11px;padding:9px 12px}.navigation-note{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card-head{padding:10px 11px 0}.stage{height:clamp(185px,52vw,260px)}.controls{gap:10px;padding:12px}.seek{order:5;flex-basis:100%}.speed-label{display:none}.background{margin-left:0;flex:1;padding-left:8px;padding-right:8px}.button{font-size:11px}.play{min-width:88px}.speed{padding:11px 8px;font-size:11px}.footer{display:block}.footer p{margin:0 0 8px}.tip{font-size:10px}}@media(max-width:370px){.controls{gap:8px}.transport{gap:4px}.button{min-width:34px;padding:9px 8px}.play{min-width:80px}.background{font-size:10px}}
.controls{margin:0 0 15px}
@media(max-width:700px){.controls{display:grid;grid-template-columns:auto minmax(0,.65fr) minmax(0,1fr);gap:8px;position:sticky;top:8px;z-index:10;padding:10px;background:#121d23fa;box-shadow:0 7px 20px #050b1070}.transport{gap:4px}.button{min-width:36px;padding:9px 8px}.play{min-width:82px}.speed{min-width:0;width:100%;padding:11px 5px}.background{min-width:0;width:100%;padding-left:5px;padding-right:5px}.seek{grid-column:1/-1;min-width:0;min-height:24px}.card{scroll-margin-top:120px}}
@media(max-width:370px){.controls{gap:8px 6px}.button{min-width:32px;padding-left:6px;padding-right:6px}.play{min-width:76px}.background{min-width:0}}
</style>
</head>
<body>
<main class="page">
  <div class="topline"><a class="back" href="../player.html">← モーション一覧</a><span class="edition">PROTOTYPE · v2</span></div>
  <header class="heading"><div><p class="eyebrow">GAME5 / MOTION STUDY</p><h1 id="title">8方向モーション</h1><p class="subtitle">8つの角度を、同じコマで確認。</p></div><div class="frame-label" id="readout">FRAME 01 / 08</div></header>
  <nav class="navigation" aria-label="モーションを選ぶ"><div class="link-group" id="characters" aria-label="キャラクター"></div><div class="link-group" id="motions" aria-label="動作"></div><span class="navigation-note">8方向 × 8コマ</span></nav>
  <p class="status" id="status" role="status" aria-live="polite">読み込み中…</p>
  <section class="controls" aria-label="再生設定">
    <div class="transport"><button type="button" class="button" id="prev" aria-label="前のコマ">‹</button><button type="button" class="button play" id="play" disabled>Ⅱ 一時停止</button><button type="button" class="button" id="next" aria-label="次のコマ">›</button></div>
    <div class="seek"><span aria-hidden="true">01</span><input id="frame" type="range" min="0" max="7" step="1" value="0" aria-label="表示するコマ" aria-valuetext="1コマ目"><span aria-hidden="true">08</span></div>
    <label class="speed-label" for="speed">再生速度</label><select class="speed" id="speed" aria-label="再生速度"><option value="0.5">0.5 ×</option><option value="1" selected>1.0 ×</option><option value="1.5">1.5 ×</option></select>
    <button type="button" class="button background" id="background" aria-pressed="false">背景を明るく</button>
  </section>
  <section class="grid" id="grid" aria-label="8方向のプレビュー"></section>
  <p class="tip">コマ送りで、足の運びや装備の見え方を確認できます。</p>
  <footer class="footer"><p><a href="../player.html">すべてのモーションを見る ↗</a></p><p>HTMLを1つだけ取り出すと、一覧や別ページへのリンクが開けない場合があります。</p></footer>
</main>
<script type="application/json" id="payload">__PAYLOAD_JSON__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("payload").textContent);
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0");
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
const count=Number(data.frames_per_cycle)||8;
const state={frame:0,playing:!reduceMotion.matches,speed:1,light:false};
const cards=[], codes=["S","SE","E","NE","N","NW","W","SW"];
const sprite=new Image();let loaded=false,raf=0,lastTime=0,elapsed=0;
const title=(data.character.label||data.character.id)+" / "+(data.motion.label||data.motion.id);
$("title").textContent=title;document.title=title+" | 8方向モーション";
function addLink(target,text,href,current){const a=document.createElement("a");a.href=href;a.textContent=text;if(current)a.setAttribute("aria-current","page");target.append(a)}
for(const character of [{id:"warrior",label:"戦士"},{id:"scout",label:"斥候"},{id:"generic",label:"汎用"}]){addLink($("characters"),character.id===data.character.id?(data.character.label||character.label):character.label,character.id+"-"+data.motion.id+".html",character.id===data.character.id)}
for(const motion of [{id:"walk",label:"歩行"},{id:"run",label:"走行"}])addLink($("motions"),motion.label,data.character.id+"-"+motion.id+".html",motion.id===data.motion.id);
for(let row=0;row<data.directions.length;row++){const card=document.createElement("article");card.className="card";const head=document.createElement("div");head.className="card-head";const name=document.createElement("span");name.textContent=data.directionLabels[row]||data.directions[row];const code=document.createElement("span");code.className="code";code.textContent=codes[row]||String(row+1);head.append(name,code);const stage=document.createElement("div");stage.className="stage";const canvas=document.createElement("canvas");canvas.setAttribute("role","img");canvas.setAttribute("aria-label",name.textContent+"の"+(data.motion.label||data.motion.id));stage.append(canvas);card.append(head,stage);$("grid").append(card);cards.push({card,canvas,context:canvas.getContext("2d"),row,visible:false,width:0,height:0})}
function drawCard(item){if(!loaded||!item.visible)return;const rect=item.canvas.getBoundingClientRect();const dpr=Math.min(devicePixelRatio||1,1.5);const width=Math.max(1,Math.round(rect.width*dpr)),height=Math.max(1,Math.round(rect.height*dpr));if(width!==item.width||height!==item.height){item.width=width;item.height=height;item.canvas.width=width;item.canvas.height=height}const ctx=item.context;ctx.clearRect(0,0,width,height);ctx.imageSmoothingEnabled=true;const scale=Math.min(width/data.frame_width,height/data.frame_height);const w=data.frame_width*scale,h=data.frame_height*scale;ctx.drawImage(sprite,state.frame*data.frame_width,item.row*data.frame_height,data.frame_width,data.frame_height,(width-w)/2,(height-h)/2,w,h)}
function draw(){for(const card of cards)drawCard(card);$("readout").textContent="FRAME "+pad(state.frame+1)+" / "+pad(count);$("frame").value=String(state.frame);$("frame").setAttribute("aria-valuetext",(state.frame+1)+"コマ目")}
function updatePlay(){const text=state.playing?"Ⅱ 一時停止":"▶ 再生";$("play").textContent=text;$("play").setAttribute("aria-label",state.playing?"一時停止":"再生")}
function cancelLoop(){if(raf)cancelAnimationFrame(raf);raf=0;lastTime=0;elapsed=0}
function ensureLoop(){if(loaded&&state.playing&&!document.hidden&&!raf)raf=requestAnimationFrame(tick)}
function tick(time){raf=0;if(!state.playing||document.hidden||!loaded){lastTime=0;return}if(!lastTime)lastTime=time;elapsed+=Math.min(200,time-lastTime);lastTime=time;const duration=(Number(data.motion.frame_ms)||120)/state.speed;if(elapsed>=duration){state.frame=(state.frame+Math.floor(elapsed/duration))%count;elapsed%=duration;draw()}ensureLoop()}
function setPlaying(playing){state.playing=playing;cancelLoop();updatePlay();ensureLoop()}
function step(delta){setPlaying(false);state.frame=(state.frame+delta+count)%count;draw()}
const visibility=new IntersectionObserver(entries=>{for(const entry of entries){const item=cards.find(card=>card.card===entry.target);item.visible=entry.isIntersecting;if(item.visible)drawCard(item)}},{rootMargin:"50px 0px"});for(const card of cards)visibility.observe(card.card);
const resize=new ResizeObserver(()=>{for(const card of cards)if(card.visible)drawCard(card)});resize.observe($("grid"));
$("prev").addEventListener("click",()=>step(-1));$("next").addEventListener("click",()=>step(1));$("play").addEventListener("click",()=>setPlaying(!state.playing));$("frame").max=String(count-1);$("frame").addEventListener("input",event=>{setPlaying(false);state.frame=Number(event.target.value);draw()});$("speed").addEventListener("change",event=>{state.speed=Number(event.target.value);elapsed=0});$("background").addEventListener("click",()=>{state.light=!state.light;$("grid").classList.toggle("light",state.light);$("background").textContent=state.light?"背景を暗く":"背景を明るく";$("background").setAttribute("aria-pressed",String(state.light))});
document.addEventListener("visibilitychange",()=>{cancelLoop();if(!document.hidden){draw();ensureLoop()}});document.addEventListener("keydown",event=>{if(event.target.closest("input,select,textarea,button,a"))return;if(event.code==="Space"){event.preventDefault();setPlaying(!state.playing)}else if(event.code==="ArrowLeft"){event.preventDefault();step(-1)}else if(event.code==="ArrowRight"){event.preventDefault();step(1)}});reduceMotion.addEventListener("change",event=>{if(event.matches)setPlaying(false)});
sprite.onload=()=>{loaded=true;$("status").textContent="";$("play").disabled=false;draw();ensureLoop()};sprite.onerror=()=>{$("status").classList.add("error");$("status").textContent="画像を読み込めませんでした。HTMLを保存し直して、ブラウザーで開いてください。";cancelLoop();setPlaying(false)};updatePlay();sprite.src=data.sheet;
</script>
</body>
</html>
