<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warrior Motion Lab v0.6.0</title>
<style>body{margin:0;background:#101720;color:#eef;font:14px system-ui}main{max-width:980px;margin:auto;padding:16px}.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{padding:8px;background:#18232c;color:#eef;border:1px solid #40505c;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.card{background:#18232c;padding:12px;border-radius:12px}.stage{display:grid;place-items:center;min-height:300px;background:#111820}.stage canvas{max-width:100%;height:auto}.qa{margin-top:12px;padding:10px;background:#171925;border-left:3px solid #b99ae8}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<main><h1>戦士モーション検査室 <small>v0.6.0</small></h1><p>walk/run は完成スプライト、攻撃・拘束・エステラは本編と同じ関節レンダラーです。</p>
<div class="bar"><select id="m"><option value="walk">歩行</option><option value="run">走行</option><option value="slash">通常斬り</option><option value="heavy">破城斬り</option><option value="bind">拘束</option><option value="estella">エステラ</option></select><select id="d"><option>front</option><option>down_right</option><option selected>right</option><option>up_right</option><option>back</option><option>up_left</option><option>left</option><option>down_left</option></select><select id="s"><option value=".5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select><button id="play">停止</button><button id="prev">◀</button><button id="next">▶</button></div>
<div class="grid"><section class="card"><b>戦士</b><div class="stage"><canvas id="w" width="384" height="543"></canvas></div><p id="wm"></p></section><section class="card"><b>汎用素体</b><div class="stage"><canvas id="g" width="192" height="256"></canvas></div><p id="gm"></p></section></div><div class="qa" id="qa">QA読込中…</div></main>
<script src="../game/warrior-motion.js"></script>
<script>
(()=>{const $=q=>document.querySelector(q),dirs=['front','down_right','right','up_right','back','up_left','left','down_left'],M=$('#m'),D=$('#d'),S=$('#s'),W=$('#w'),G=$('#g'),wc=W.getContext('2d'),gc=G.getContext('2d');let f=0,p=0,last=performance.now(),on=true;
const I=u=>{const x=new Image();x.src=u;return x},sheet={ww:I('exports/warrior/walk.png'),wr:I('exports/warrior/vun.png'),gw:I('generic/generic-walk-8dir-8frames.png'),gr:I('generic/generic/generic-run-8dir-8frames.png')};
function render(){const mo=M.value,di=dirs.indexOf(D.value);wc.clearRect(0,0,384,543);gc.clearRect(0,0,192,256);if(mo==='walk'||mo==='run'){const wi=mo==='walk'?sheet.ww:sheet.wr,gi=mo==='walk'?sheet.gw:sheet.gr,fi=Math.floor(f)%8;if(wi.complete){ wc.drawImage(wi,fi*384,di*512,384,512,0,15,384,512)}if(gi.complete){gc.drawImage(gi,fi*192,di*256,192,256,0,0,192,256)}$('#wm').textContent=`${D.value} / frame ${fi+1}`;$('#gm').textContent='同位组の汎用素体'}else{window.WarriorMotion?.drawLab?.(wc,D.value,mo,p,{rootX:192,rootY:330,scale:1});gc.fillStyle='#9aa8b2';gc.fillText('戦士固有リグ',50,128);$('#wm').textContent=`${D.value} / ${Math.round(p*100)}%`;$('#gm').textContent='walk/run比較専用'}const q=window.WarriorMotion?.qa?.();$('#qa').textContent=q?`通常檜ぃQA: max Δ 4{q.maxJointDelta}° / peak ${q.peakProgress*100}% / smooth=${q.smooth} / impactClose=${q.impactClose}`:'レンダラー読込中…'}
function tick(now){const dt=(now-last)/1000;last=now;if(on){const k=+S.value;if(M.value==='walk')f=(f+dt*k/.12)%8;else if(M.value==='run')f=(f+dt*k/.08)%8;else p=(p+dt*k/(M.value==='estella'?2.6:1))%1;render()}requestAnimationFrame(tick)}
M.onchange=()=>{f=p=0;render()};D.onchange=render;S.onchange=render;$('#play').onclick=()=>{on=!on;$('#play').textContent=on?'停止':'再生'};$('#prev').onclick=()=>{on=false;if(M.value==='walk'||M.value==='run')f=(f+7)%8;else p=(p+.95)%1;render()};$('#jext').onclick=()=>{on=false;if(M.value==='walk'||M.value==='run')f=(f+1)%8;else p=(p+.05)%1;render()};render();requestAnimationFrame(tick)})();
</script>
