<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>歩行素体 — 正面・右向き</title>
<style>
:root{color-scheme:dark;--bg:#15181f;--panel:#20232d;--line:#3b404f;--ink:#e9e9ef;--muted:#afb5c3;--accent:#90dfcf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:26px 24px 44px}header{display:flex;justify-content:space-between;align-items:start;gap:20px}h1{font-size:24px;margin:0}header p{margin:5px 0;color:var(--muted)}.tag{font-size:12px;white-space:nowrap;border:1px solid var(--line);padding:5px 10px;border-radius:20px}.toolbar,.tuning{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}button{font:inherit;color:var(--ink);background:#292e3a;border:1px solid #474f61;border-radius:7px;padding:7px 13px;cursor:pointer}button:hover{border-color:var(--accent)}button[aria-pressed="true"]{border-color:var(--accent);background:#24463f}#play{background:var(--accent);color:#132923;border-color:var(--accent)}label{display:flex;gap:8px;align-items:center}input{accent-color:var(--accent)}.views,.partviews{display:grid;grid-template-columns:1fr 1fr;gap:20px}.view{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}.caption{padding:12px 16px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}.caption span{font-size:13px;color:var(--muted)}.sprite{display:block;width:min(100%,384px);height:auto;image-rendering:pixelated;margin:auto}.angles{display:flex;justify-content:space-between;padding:9px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}#frames{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 5px}#frames button{min-width:42px}#phase{font-size:13px;color:var(--muted)}.tuning{padding:18px;background:var(--panel);border-radius:10px;justify-content:space-between}.tuning label{flex-wrap:wrap;font-size:13px}.tuning output{width:46px;text-align:right;font-variant-numeric:tabular-nums}.note{color:var(--muted);font-size:13px}.partviews canvas{width:100%;height:auto;image-rendering:pixelated;background:var(--panel);border-radius:10px}h2{font-size:18px;margin-top:25px}.hidden{display:none}a{color:var(--accent)}@media(max-width:650px){main{padding:18px 12px}header{display:block}.tag{display:inline-block;margin-top:8px}.views,.partviews{gap:8px}.caption{display:block;padding:8px}.caption span{display:block}.angles{display:block;padding:8px;font-size:11px}.angles span{display:block}.tuning{display:block}.tuning label{margin:8px 0}.toolbar{gap:7px}button{padding:7px 10px}}
</style></head><body><main>
<header><div><h1>歩行素体</h1><p>正面と右向きの、部位を差し替えられる歩行モデル</p></div><span class="tag">1歩4コマ · 1周期8コマ</span></header>
<div class="toolbar"><button id="play" aria-pressed="false">再生</button><button id="step">1コマ進む</button><button id="joints" aria-pressed="false">関節を表示</button><button id="parts" aria-pressed="false">分割パーツ</button><button id="save">現在の関節データを保存</button></div>
<div class="views"><section class="view"><div class="caption"><strong>正面</strong><span>前後の重なり・奥行き</span></div><canvas id="front" class="sprite" width="384" height="512" aria-label="正面歩行"></canvas><div class="angles"><span id="frontLeft"></span><span id="frontRight"></span></div></section><section class="view"><div class="caption"><strong>右向き</strong><span>膝の先行・踵の接地</span></div><canvas id="side" class="sprite" width="384" height="512" aria-label="右向き歩行"></canvas><div class="angles"><span id="sideFar"></span><span id="sideNear"></span></div></section></div>
<div id="frames" aria-label="フレーム選択"></div><div id="phase"></div>
<div class="tuning"><label>速度 <input id="speed" type="range" min="4" max="12" step="0.1" value="8.3"><output id="speedValue">8.3 fps</output></label><label>腕振り <input id="swing" type="range" min="0" max="130" value="100"><output id="swingValue">100%</output></label><label>肘の曲げの変化 <input id="bend" type="range" min="0" max="140" value="100"><output id="bendValue">100%</output></label><button id="reset">標準に戻す</button></div>
<p class="note">肩→上腕→肘→前腕→手首→手、股関節→上腿→膝→下腿→足首→足を連動させています。肘の曲がりは腕振りから少し遅れて変わります。関節表示では肘が橙、ほかの関節が緑です。</p>
<section id="partsPanel" class="hidden"><h2>分割パーツ</h2><p class="note">各方向17種類。左右に配置して29個の描画パーツを組み立てます。腕と脚は現在のコマの角度・縮み方で表示します。</p><div class="partviews"><div><h3>正面</h3><canvas id="partsFront" width="720" height="405"></canvas></div><div><h3>右向き</h3><canvas id="partsSide" width="720" height="405"></canvas></div></div></section>
<p class="note">透過素材は192 × 256 px。影とマス目は確認用です。コマ間の補間は行いません。</p>
<script id="walk-data" type="application/json">__DATA__</script>
<script>__RIG_CODE__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('walk-data').textContent),RIG=PlainWalkRig;
const el=id=>document.getElementById(id),images={front:{},side:{}},params={...DATA.config.parameters};
let frame=0,playing=false,showJoints=false,showParts=false,last=0,frameMS=DATA.config.frame_ms,ready=false;
const phaseNames=['接地①','沈み込み①','通過①','蹴り出し①','接地②','沈み込み②','通過②','蹴り出し②'];
for(let f=0;f<8;f++){const b=document.createElement('button');b.textContent=String(f+1).padStart(2,'0');b.onclick=()=>{frame=f;playing=false;syncPlay();render();};el('frames').append(b);}
function syncPlay(){el('play').textContent=playing?'一時停止':'再生';el('play').setAttribute('aria-pressed',String(playing));}
function partsCanvas(view,pose){
 const c=el(view==='front'?'partsFront':'partsSide'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=false;
 Object.entries(DATA.assets[view]).forEach(([name,a],i)=>{
  const x=(i%6)*120+60,y=Math.floor(i/6)*135+53,t=pose.ops.find(o=>o.asset===name&&o.id.endsWith('near'))||pose.ops.find(o=>o.asset===name);
  const s=Math.min(2.5,78/a.size[0],82/a.size[1]);ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate((t?.angle||0)*Math.PI/180);if(t)ctx.scale(Math.abs(t.scale[0]),t.scale[1]);
  ctx.drawImage(images[view][name],-a.size[0]/2,-a.size[1]/2);ctx.restore();
  ctx.textAlign='center';ctx.fillStyle='#e9e9ef';ctx.font='13px system-ui,sans-serif';ctx.fillText(RIG.labels[name],x,y+48);ctx.fillStyle='#969ead';ctx.font='10px monospace';ctx.fillText(name,x,y+63);
 });
}
function render(){
 if(!ready)return;
 const poses={};for(const view of ['front','side']){const pose=RIG.makePose(view,frame,DATA.config,DATA.assets,params);poses[view]=pose;RIG.drawStage(el(view).getContext('2d'),pose,images,DATA.assets,{joints:showJoints});if(showParts)partsCanvas(view,pose);}
 for(const [id,view,side,title] of [['frontLeft','front','far','左の肘'],['frontRight','front','near','右の肘'],['sideFar','side','far','奥の肘'],['sideNear','side','near','手前の肘']])el(id).textContent=title+' '+poses[view].arms[side].elbow_flex.toFixed(0)+'°';
 Array.from(el('frames').children).forEach((b,i)=>b.setAttribute('aria-pressed',String(i===frame)));
 el('phase').textContent=String(frame+1).padStart(2,'0')+' / 08 · '+phaseNames[frame];
}
el('play').onclick=()=>{playing=!playing;last=performance.now();syncPlay();};
el('step').onclick=()=>{playing=false;syncPlay();frame=(frame+1)%8;render();};
el('joints').onclick=()=>{showJoints=!showJoints;el('joints').setAttribute('aria-pressed',String(showJoints));render();};
el('parts').onclick=()=>{showParts=!showParts;el('parts').setAttribute('aria-pressed',String(showParts));el('partsPanel').classList.toggle('hidden',!showParts);render();};
el('speed').oninput=e=>{frameMS=1000/Number(e.target.value);el('speedValue').textContent=Number(e.target.value).toFixed(1)+' fps';};
el('swing').oninput=e=>{params.arm_swing=Number(e.target.value)/100;el('swingValue').textContent=e.target.value+'%';render();};
el('bend').oninput=e=>{params.elbow_variation=Number(e.target.value)/100;el('bendValue').textContent=e.target.value+'%';render();};
el('reset').onclick=()=>{Object.assign(params,DATA.config.parameters);frameMS=DATA.config.frame_ms;el('speed').value='8.3';el('swing').value=el('bend').value='100';el('speedValue').textContent='8.3 fps';el('swingValue').textContent=el('bendValue').textContent='100%';render();};
el('save').onclick=()=>{const data={frame,parameters:params,front:RIG.makePose('front',frame,DATA.config,DATA.assets,params),side:RIG.makePose('side',frame,DATA.config,DATA.assets,params)};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='walk-pose-'+String(frame+1).padStart(2,'0')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
Promise.all(Object.entries(DATA.images).flatMap(([v,items])=>Object.entries(items).map(([n,src])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[v][n]=im;resolve();};im.onerror=reject;im.src=src;})))).then(()=>{ready=true;playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;syncPlay();render();requestAnimationFrame(tick);}).catch(()=>{el('phase').textContent='画像を読み込めませんでした。ファイルを開き直してください。';});
function tick(now){if(playing&&now-last>=frameMS){frame=(frame+Math.max(1,Math.floor((now-last)/frameMS)))%8;last=now;render();}requestAnimationFrame(tick);}
</script></main></body></html>
