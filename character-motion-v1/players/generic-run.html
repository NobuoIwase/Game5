<script>
"use strict";
const data=JSON.parse(document.getElementById("payload").textContent);
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0");
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
const count=Number(data.frames_per_cycle)||8;
const state={frame:0,playing:!reduceMotion.matches,speed:1,light:false};
const cards=[], codes=["S","SE","E","NE","N","NW","W","SW"];
const sprite=new Image();let loaded=false,raf=0,lastTime=0,elapsed=0;
const title=(data.character.label||data.character.id)+" / "+(data.motion.label||data.motion.id);
$("title").textContent=title;document.title=title+" | 8方向モーション";
function addLink(target,text,href,current){const a=document.createElement("a");a.href=href;a.textContent=text;if(current)a.setAttribute("aria-current","page");target.append(a)}
for(const character of [{id:"warrior",label:"戦士"},{id:"scout",label:"斥候"},{id:"generic",label:"汎用"}]){addLink($("characters"),character.id===data.character.id?(data.character.label||character.label):character.label,character.id+"-"+data.motion.id+".html",character.id===data.character.id)}
for(const motion of [{id:"walk",label:"歩行"},{id:"run",label:"走行"}])addLink($("motions"),motion.label,data.character.id+"-"+motion.id+".html",motion.id===data.motion.id);
for(let row=0;row<data.directions.length;row++){const card=document.createElement("article");card.className="card";const head=document.createElement("div");head.className="card-head";const name=document.createElement("span");name.textContent=data.directionLabels[row]||data.directions[row];const code=document.createElement("span");code.className="code";code.textContent=codes[row]||String(row+1);head.append(name,code);const stage=document.createElement("div");stage.className="stage";const canvas=document.createElement("canvas");canvas.setAttribute("role","img");canvas.setAttribute("aria-label",name.textContent+"の"+(data.motion.label||data.motion.id));stage.append(canvas);card.append(head,stage);$("grid").append(card);cards.push({card,canvas,context:canvas.getContext("2d"),row,visible:false,width:0,height:0})}
function drawCard(item){if(!loaded||!item.visible)return;const rect=item.canvas.getBoundingClientRect();const dpr=Math.min(devicePixelRatio||1,1.5);const width=Math.max(1,Math.round(rect.width*dpr)),height=Math.max(1,Math.round(rect.height*dpr));if(width!==item.width||height!==item.height){item.width=width;item.height=height;item.canvas.width=width;item.canvas.height=height}const ctx=item.context;ctx.clearRect(0,0,width,height);ctx.imageSmoothingEnabled=true;const scale=Math.min(width/data.frame_width,height/data.frame_height);const w=data.frame_width*scale,h=data.frame_height*scale;ctx.drawImage(sprite,state.frame*data.frame_width,item.row*data.frame_height,data.frame_width,data.frame_height,(width-w)/2,(height-h)/2,w,h)}
function draw(){for(const card of cards)drawCard(card);$("readout").textContent="FRAME "+pad(state.frame+1)+" / "+pad(count);$("frame").value=String(state.frame);$("frame").setAttribute("aria-valuetext",(state.frame+1)+"コマ目")}
function updatePlay(){const text=state.playing?"Ⅱ 一時停止":"▶ 再生";$("play").textContent=text;$("play").setAttribute("aria-label",state.playing?"一時停止":"再生")}
function cancelLoop(){if(raf)cancelAnimationFrame(raf);raf=0;lastTime=0;elapsed=0}
function ensureLoop(){if(loaded&&state.playing&&!document.hidden&&!raf)raf=requestAnimationFrame(tick)}
function tick(time){raf=0;if(!state.playing||document.hidden||!loaded){lastTime=0;return}if(!lastTime)lastTime=time;elapsed+=Math.min(200,time-lastTime);lastTime=time;const duration=(Number(data.motion.frame_ms)||120)/state.speed;if(elapsed>=duration){state.frame=(state.frame+Math.floor(elapsed/duration))%count;elapsed%=duration;draw()}ensureLoop()}
function setPlaying(playing){state.playing=playing;cancelLoop();updatePlay();ensureLoop()}
function step(delta){setPlaying(false);state.frame=(state.frame+delta+count)%count;draw()}
const visibility=new IntersectionObserver(entries=>{for(const entry of entries){const item=cards.find(card=>card.card===entry.target);item.visible=entry.isIntersecting;if(item.visible)drawCard(item)}},{rootMargin:"50px 0px"});for(const card of cards)visibility.observe(card.card);
const resize=new ResizeObserver(()=>{for(const card of cards)if(card.visible)drawCard(card)});resize.observe($("grid"));
$("prev").addEventListener("click",()=>step(-1));$("next").addEventListener("click",()=>step(1));$("play").addEventListener("click",()=>setPlaying(!state.playing));$("frame").max=String(count-1);$("frame").addEventListener("input",event=>{setPlaying(false);state.frame=Number(event.target.value);draw()});$("speed").addEventListener("change",event=>{state.speed=Number(event.target.value);elapsed=0});$("background").addEventListener("click",()=>{state.light=!state.light;$("grid").classList.toggle("light",state.light);$("background").textContent=state.light?"背景を暗く":"背景を明るく";$("background").setAttribute("aria-pressed",String(state.light))});
document.addEventListener("visibilitychange",()=>{cancelLoop();if(!document.hidden){draw();ensureLoop()}});document.addEventListener("keydown",event=>{if(event.target.closest("input,select,textarea,button,a"))return;if(event.code==="Space"){event.preventDefault();setPlaying(!state.playing)}else if(event.code==="ArrowLeft"){event.preventDefault();step(-1)}else if(event.code==="ArrowRight"){event.preventDefault();step(1)}});reduceMotion.addEventListener("change",event=>{if(event.matches)setPlaying(false)});
sprite.onload=()=>{loaded=true;$("status").textContent="";$("play").disabled=false;draw();ensureLoop()};sprite.onerror=()=>{$("status").classList.add("error");$("status").textContent="画像を読み込めませんでした。HTMLを保存し直して、ブラウザーで開いてください。";cancelLoop();setPlaying(false)};updatePlay();sprite.src=data.sheet;
</script>
